# api.slack.com/apps → Create New App → From a manifest.
display_information:
  name: CB PR Status
  description: Keeps an emoji on GitHub PR links for review states at a glance
  background_color: "#1f2933"
  long_description: >-
    Watches review channels for GitHub pull request links, maintains a single
    status reaction on each message, and updates it as the PR progresses.
    Only ever manages its own emoji.

features:
  bot_user:
    display_name: CB PR Status
    always_online: true
  unfurl_domains:
    - github.com

oauth_config:
  scopes:
    bot:
      - links:read
      - reactions:write
      - reactions:read
      - channels:history
      - groups:history

settings:
  event_subscriptions:
    bot_events:
      - link_shared
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
